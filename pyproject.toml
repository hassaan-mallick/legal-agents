[project]
name = "legal-agents"
version = "0.1.0"
description = "LLM-agnostic legal agents with governance enforced in code. Built in public by Hassaan Mallick."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Hassaan Mallick" }]
dependencies = [
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "anthropic>=1,<2",
  "openai>=1,<3",
  "rapidfuzz>=3,<4",
  "httpx>=0.27",
  "pypdf>=5",
]

[project.optional-dependencies]
citations = ["eyecite>=2.7.8"]
rlm = ["dspy>=3.3"]
desk = ["imgui-bundle>=1.92", "numpy>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
la = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"desk/*" = ["E501", "E702"]
